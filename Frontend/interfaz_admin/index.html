<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINISTRADOR</title>

    <link rel="stylesheet"

                <button class="btn">REGISTRAR MEMBRESÍA</button>

            <a href="/panel_ad/reg_actividad" target="contenido">

            </a>

            </a>

            <a href="/login">
                <button class="btn">CERRAR SESIÓN</button>
            </a>

        <img src="{{ url_for('static', filename='img/Logo.jpg') }}"
             alt="Logo del gimnasio"
             class="logo">

    </div>

    <div class="panel_derecho">

        <iframe name="contenido" frameborder="0"></iframe>

</html>
