<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Membresías
    </title>

    <link rel="stylesheet"
          href="{{ url_for(
                'static',
                filename='interfaz_admin/paneles_ad/reg_membresia/style.css'
          ) }}">

</head>

<body>

<div class="contenedor">

    <h1>
        GESTIÓN DE MEMBRESÍAS
    </h1>

    <form method="POST">

        <input type="hidden"
               name="id_membresia"
               value="{{
                    membresia_edit.id_membresia
                    if membresia_edit else ''
               }}">

        <!-- NOMBRE -->

        <div class="grupo">

            <label>
                Nombre
            </label>

            <input type="text"
                   name="nombre"
                   required
                   value="{{
                        membresia_edit.nombre
                        if membresia_edit else ''
                   }}">

        </div>

        <!-- DURACION -->

        <div class="grupo">

            <label>
                Duración (Días)
            </label>

            <input type="number"
                   name="duracion_dias"
                   required
                   value="{{
                        membresia_edit.duracion_dias
                        if membresia_edit else ''
                   }}">

        </div>

        <!-- PRECIO -->

        <div class="grupo">

            <label>
                Precio
            </label>

            <input type="number"
                   step="0.01"
                   name="precio"
                   required
                   value="{{
                        membresia_edit.precio
                        if membresia_edit else ''
                   }}">

        </div>

        <!-- ACTIVIDAD -->

        <div class="grupo">

            <label>
                Actividad
            </label>

            <select name="id_actividad" required>

                <option value="">
                    Seleccione una actividad
                </option>

                {% for actividad in actividades_select %}

                <option
                    value="{{ actividad.id_actividad }}"

                    {% if membresia_edit
                    and membresia_edit.id_actividad == actividad.id_actividad %}
                    selected
                    {% endif %}>

                    {{ actividad.nombre }}

                </option>

                {% endfor %}

            </select>

        </div>

        <!-- BOTONES -->

        <div class="botones">

            <button type="submit"
                    name="accion"
                    value="guardar"
                    class="guardar">

                Guardar

            </button>

            <button type="submit"
                    name="accion"
                    value="editar"
                    class="editar">

                Editar

            </button>

        </div>

    </form>

    <!-- TABLA -->

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Nombre</th>

                <th>Duración</th>

                <th>Precio</th>

                <th>Actividad</th>

                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            {% for membresia in membresias %}

            <tr>

                <td>
                    {{ membresia.id_membresia }}
                </td>

                <td>
                    {{ membresia.nombre }}
                </td>

                <td>
                    {{ membresia.duracion_dias }}
                </td>

                <td>
                    {{ membresia.precio }}
                </td>

                <td>
                    {{ membresia.actividad }}
                </td>

                <td class="acciones">

                    <!-- SELECCIONAR -->

                    <form method="POST"
                          style="display:inline;">

                        <input type="hidden"
                               name="id_membresia"
                               value="{{ membresia.id_membresia }}">

                        <input type="hidden"
                               name="nombre"
                               value="{{ membresia.nombre }}">

                        <input type="hidden"
                               name="duracion_dias"
                               value="{{ membresia.duracion_dias }}">

                        <input type="hidden"
                               name="precio"
                               value="{{ membresia.precio }}">

                        <input type="hidden"
                               name="id_actividad"
                               value="{{ membresia.id_actividad }}">

                        <button type="submit"
                                name="accion"
                                value="seleccionar"
                                class="editar">

                            Seleccionar

                        </button>

                    </form>

                    <!-- ELIMINAR -->

                    <form method="POST"
                          style="display:inline;">

                        <input type="hidden"
                               name="id_membresia"
                               value="{{ membresia.id_membresia }}">

                        <button type="submit"
                                name="accion"
                                value="eliminar"
                                class="eliminar">

                            Eliminar

                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
