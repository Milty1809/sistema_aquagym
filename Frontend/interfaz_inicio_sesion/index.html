<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO DE SESION</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="formulario">
        <img class="imagen" src="/Frontend/img/Logo.jpg" width="150" height="150">
        <h1>Iniciar Sesión</h1>
        <form method="post">
            <div class="username">
                <input type="text" required>
                <label>Nombre de usuario</label>
            </div>
            <div class="contraseña">
                <input type="password" required>
                <label>Contraseña</label>
            </div>
            <input class="inicio_sesion" type="submit" value="Iniciar Sesión">
            <div class="registrarse">
                <p>¿No tienes una cuenta? <a href="http://127.0.0.1:5500/Frontend/interfaz_registro_usu/index.html#">Regístrate aquí</a></p>
            </div>
        </form>
    </div>
</body>

</html>
