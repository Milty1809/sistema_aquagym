<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRAR USUARIO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="formulario">
        <h1>Registrar Usuario</h1>
        <form method="post">
            <div class="nombre">
                <input type="text" required>
                <label>Nombre</label>
            </div>
            <div class="apellido">
                <input type="text" required>
                <label>Apellido</label>
            </div>
            <div class="rol">
                <select>
                    <option>Entrenador</option>
                    <option>recepcionista</option>
                    <option>socio</option>
                </select> 
                <label>Rol</label>             
            </div>
            <div class="username">
                <input type="text" required>
                <label>Nombre de usuario</label>
            </div>
            <div class="contraseña">
                <input type="password" required>
                <label>Contraseña</label>
            </div>
            <div class="confirmar_contraseña">
                <input type="password" required>
                <label>Confirmar Contraseña</label>
            </div>
            <input class="registrar_usu" type="submit" value="Registrar Usuario">
            <div class="volver_inicio_sesion">
                <p>¿Ya tienes una cuenta? <a href="http://127.0.0.1:5500/Frontend/interfaz_inicio_sesion/index.html">Inicia sesión aquí</a></p>
            </div>
        </form>
    </div>
</body>
</html>
